name: OpenAI Translation Provider Live Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-provider-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-provider:
    name: OpenAI live translation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run controlled live provider smoke
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL }}
          OPENAI_TRANSLATION_BASE_URL: ${{ vars.OPENAI_TRANSLATION_BASE_URL }}
          OPENAI_TRANSLATION_REGION: ${{ vars.OPENAI_TRANSLATION_REGION }}
        run: npm run smoke:openai-provider-live
