name: Context Restack Diagnostic

on:
  push:
    branches:
      - restack/context-engine-runtime-v1-20261005

permissions:
  contents: read

jobs:
  isolate-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck and build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Run Node test files independently
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "DIAGNOSTIC_TEST_START=$file"
            timeout --signal=TERM --kill-after=5s 30s node --test "$file"
            echo "DIAGNOSTIC_TEST_PASS=$file"
          done
